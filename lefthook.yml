# Lefthook dispatcher (core.md C7.8). Policy lives in the `just` recipes from
# the C7.10 contract; this file only loads the shared configs. Repository jobs
# would go here under names that never start with `core-` or `owner-`.
remotes:
  - git_url: https://github.com/deathpie/.github
    ref: hooks-v3
    configs:
      - hooks/core.yml
      - hooks/owner.yml
